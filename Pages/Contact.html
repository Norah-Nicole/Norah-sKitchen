<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Norah's Kitchen</title>
    <link rel="stylesheet" href="../Assets/css/styles.css">
    <style>
        .contact-section {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #d4a373;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }
        button {
            background-color: #d4a373;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #b07b50;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">NORAH'S KITCHEN</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="Recipes.html">Recipes</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="hero">
    <img src="../Assets/Images/logo pic.jpg" alt="Contact Banner">
    <h1>Get in Touch</h1>
</section>

<section class="contact-section">
    <p>
        Have a recipe question, collaboration idea, or just want to say hello?  
        Fill in the form below, and I’ll get back to you as soon as possible.
    </p>

    <form action="mailto:youremail@example.com" method="post" enctype="text/plain">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>
</section>

<footer>
    The secret ingredient is always love ❤️
</footer>

</body>
</html>
